<svg class="project-diagram sav-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 480" role="img" aria-labelledby="sav-diagram-title sav-diagram-desc">
    <title id="sav-diagram-title">SAV-SLAM: from visual objects and sound streams to attribution</title>
    <desc id="sav-diagram-desc">VGGT-SLAM and YOLO map objects. CLAP and SAM Audio discover and separate sound streams. Semantic binding supplies candidate objects. A time-frequency mask from the separated streams weights the raw four-microphone channels without changing their relative phase. SRP-PHAT estimates an azimuth, which maps to an image column to resolve candidates. The diagram is schematic; the system can report bound, ambiguous, or unattributed.</desc>
    <defs>
        <marker id="sav-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="var(--accent)" stroke-width="1.3"/></marker>
    </defs>
    <g class="diagram-links" fill="none" stroke="var(--accent)" stroke-width="1.3" marker-end="url(#sav-arrow)">
        <path d="M109 78V111"/>
        <path d="M331 78V111"/>
        <path d="M260 78V94H169V111"/>
        <path d="M12 147H4V296H109V315"/>
        <path d="M331 178V225"/>
        <path d="M206 250H233"/>
        <path d="M331 276V315"/>
    </g>
    <g class="diagram-node">
        <rect x="12" y="12" width="194" height="66" rx="5"/>
        <rect x="234" y="12" width="194" height="66" rx="5"/>
        <rect x="12" y="112" width="194" height="66" rx="5"/>
        <rect x="234" y="112" width="194" height="66" rx="5"/>
        <rect x="12" y="220" width="194" height="56" rx="5"/>
        <rect x="234" y="226" width="194" height="50" rx="5"/>
    </g>
    <g class="diagram-heading" text-anchor="middle">
        <text x="109" y="39">3D objects</text>
        <text x="331" y="39">Sound streams</text>
        <text x="109" y="139">Semantic candidates</text>
        <text x="331" y="139">Time-frequency mask</text>
        <text x="331" y="257">SRP-PHAT → azimuth</text>
    </g>
    <g class="diagram-note" text-anchor="middle">
        <text x="109" y="60">VGGT-SLAM + YOLO</text>
        <text x="331" y="60">CLAP + SAM Audio</text>
        <text x="109" y="160">Object ↔ sound affinity</text>
        <text x="331" y="160">Target + residual energy</text>
        <text x="345" y="203" text-anchor="start">mask</text>
        <text x="318" y="301" text-anchor="end">Bearing → pixel column</text>
    </g>
    <g fill="var(--accent)"><circle cx="29" cy="238" r="3"/><circle cx="41" cy="238" r="3"/><circle cx="29" cy="250" r="3"/><circle cx="41" cy="250" r="3"/></g>
    <text x="57" y="243" class="diagram-heading">Raw 4-mic audio</text>
    <text x="57" y="262" class="diagram-note">Relative phase kept</text>
    <rect x="12" y="316" width="416" height="111" rx="5" class="diagram-node"/>
    <text x="25" y="338" class="diagram-note">IMAGE-SPACE ATTRIBUTION</text>
    <rect x="308" y="317" width="46" height="109" fill="var(--diagram-warm)" opacity=".12"/>
    <path d="M308 317V426M354 317V426" stroke="var(--diagram-warm)" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M331 320V405" stroke="var(--diagram-warm)" stroke-dasharray="2 4" opacity=".6"/>
    <g fill="none" stroke="var(--muted)" stroke-width="1.5">
        <rect x="63" y="352" width="78" height="39" rx="2"/><path d="M102 391V397M90 397H114"/>
        <path d="M174 358h57v33h-57zM168 397h69l-6-6h-57z"/>
    </g>
    <g stroke="var(--accent)" stroke-width="1.6" fill="var(--diagram-node-bg)">
        <rect x="316" y="351" width="30" height="44" rx="6"/><circle cx="331" cy="367" r="6"/><circle cx="331" cy="384" r="3"/>
        <path d="M299 351q-9 18 0 36m-7-41q-13 24 0 46" fill="none" stroke="var(--diagram-warm)"/>
    </g>
    <g class="diagram-note" text-anchor="middle"><text x="102" y="415">TV</text><text x="202" y="415">Laptop</text><text x="331" y="415" fill="var(--accent)">Speaker</text></g>
    <g class="diagram-state"><rect x="12" y="447" width="113" height="28" rx="4"/><rect x="139" y="447" width="139" height="28" rx="4"/><rect x="292" y="447" width="136" height="28" rx="4"/></g>
    <g class="diagram-note" text-anchor="middle"><text x="68" y="466" fill="var(--accent)">Bound</text><text x="208" y="466">Ambiguous</text><text x="360" y="466">Unattributed</text></g>
</svg>
